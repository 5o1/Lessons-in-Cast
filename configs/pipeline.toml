[galgame]
backend = "renpy"

[batching]
target_size = 50
context_before = 12
context_after = 12
max_characters = 40000

[annotation]
allowed_emotions = [
    "neutral",
    "happy",
    "sad",
    "angry",
    "afraid",
    "surprised",
    "disgusted",
    "embarrassed",
    "affectionate",
    "excited",
    "calm",
    "confused",
    "sarcastic",
    "distressed",
    "tearful_resolve",
    "restrained_grief",
    "emotional_breakdown",
    "tearful_remorse",
    "playful_affection",
    "guarded_composure",
    "firm_boundary",
    "cheerful_pressure",
    "tentative_hope",
    "possessive_care",
]
allowed_effects = [
    "chorus",
    "distortion",
    "echo",
    "glitch",
    "reverb",
    "telephone",
]
maximum_length_ratio = 4.0
minimum_length_ratio = 0.15

[codex]
batches_per_packet = 2
source_files = ["game/script.rpy"]
prompt_path = "prompts/codex_dialogue_cleanup_v4.md"
prompt_version = "cleaning-v4"
polish_prompt_path = "prompts/codex_dialogue_polish.md"
polish_prompt_version = "polish-v2"

[audio]
format = "opus"
intermediate_format = "wav"
sample_rate = 48000
channels = 1
sample_width = 2
bitrate_kbps = 48
ffmpeg_executable = "ffmpeg"
ffprobe_executable = "ffprobe"
minimum_duration_seconds = 0.05
maximum_duration_seconds = 120.0
