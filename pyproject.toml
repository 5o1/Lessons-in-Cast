[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lessons-in-cast"
version = "0.1.0"
description = "A backend-agnostic dialogue-to-voice pipeline for visual novels."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lessons-in-cast = "lessons_in_cast_core.cli:main"
lessons-in-cast-voice-design = "lessons_in_cast_core.voice_design.cli:main"
lessons-in-cast-audition = "lessons_in_cast_core.audition.cli:main"
lessons-in-cast-effects = "lessons_in_cast_core.effects.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
