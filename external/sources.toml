# Project metadata for third-party Git submodules.
# URLs are stored in `.gitmodules`; revisions are pinned by the parent gitlinks.

[projects.gpt_sovits]
path = "external/GPT-SoVITS"
role = "Supported speech backend and implementation reference"

[projects.gpt_sovits_emotion_manager]
path = "external/GPT-SoVITS-Emotion-Manager"
role = "Emotion-workflow implementation reference"

[projects.gpt_sovits_galgame_pipeline]
path = "external/GPT-SoVITS-Galgame-Pipeline"
role = "Visual-novel integration implementation reference"

[projects.index_tts]
path = "external/index-tts"
role = "Active IndexTTS 2.5 speech backend"
python = "3.11"
setup = ["uv sync --all-extras"]

[projects.renpy]
path = "external/renpy"
role = "Dialogue extraction runtime and source reference"

[projects.voxcpm]
path = "external/VoxCPM"
role = "VoxCPM2 voice design and reference-conditioned style control"
python = "3.11"
setup = ["python -m pip install -e ."]

[projects.comfyui]
path = "external/ComfyUI"
role = "Isolated local MiniMax H3 Ref2VA audio worker using native nodes"
python = "3.12"
setup = ["uv venv --python /path/to/conda/env/bin/python .venv", "uv pip install --python .venv/bin/python -r requirements.txt"]
